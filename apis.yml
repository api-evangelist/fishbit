name: Fishbit
description: Fishbit is a smart-aquarium management company whose platform pairs a mobile app (iOS/Android)
  with connected hardware — the Fishbit Monitor, which tracks water parameters such as pH, temperature, and
  salinity in real time, and the Fishbit Controller, which wirelessly automates aquarium equipment. Hobbyists
  and reef keepers use the system to remotely monitor tank conditions and automate lighting, pumps, and dosing.
  The company sells its monitoring and control hardware through an online store and ran a device-manufacturer
  partner program (e.g. RapidLED Corona integration). No public API, developer portal, or SDK is currently
  published; this API Evangelist profile tracks the company as a connected-hardware / IoT lead.
